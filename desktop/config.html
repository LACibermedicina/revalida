<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Revalida Prático — servidor</title>
<style>body{font-family:system-ui,sans-serif;background:#eef3ff;display:grid;place-items:center;height:100vh;margin:0}
main{background:#fff;border-radius:22px;padding:28px;width:min(440px,90vw);box-shadow:0 10px 30px #16233b22}
input{width:100%;box-sizing:border-box;min-height:44px;border-radius:14px;border:1px solid #cdd7ee;padding:0 12px;font:inherit}
button{margin-top:12px;min-height:44px;width:100%;border:0;border-radius:14px;background:#2563eb;color:#fff;font-weight:700;font:inherit;cursor:pointer}
#e{color:#d6402b;font-weight:700;min-height:1.2em}</style></head>
<body><main><h1>Revalida Prático</h1><p>Informe o endereço do servidor da sua instituição.</p>
<input id="u" placeholder="https://revalida.seudominio.com" autofocus><div id="e" role="alert"></div>
<button id="b">Conectar</button></main>
<script>
const go=async()=>{const r=await window.rv.salvarServidor(document.getElementById('u').value);if(!r.ok)document.getElementById('e').textContent=r.erro};
document.getElementById('b').onclick=go;document.getElementById('u').onkeydown=e=>e.key==='Enter'&&go();
</script></body></html>
