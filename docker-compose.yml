services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revalida
      POSTGRES_PASSWORD: revalida
      POSTGRES_DB: revalida
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revalida"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgres://revalida:revalida@db:5432/revalida
      PORT: "3001"
      NODE_ENV: ${NODE_ENV:-development}
    ports: ["3001:3001"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
