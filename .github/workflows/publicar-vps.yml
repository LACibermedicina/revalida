# Publica o app na VPS a cada push na main que mexa em app/ (ou à mão: Actions > "Publicar na VPS" > Run workflow).
# Copia app/ para a VPS (rsync: não apaga nada lá e não toca nos .env nem nos backups) e roda
# app/scripts/vps-preparar.sh, que na 1ª vez instala tudo (Docker, portas livres > 1000, proxy reverso nginx + HTTPS)
# e nas seguintes faz backup -> migrações -> rebuild -> conferência.
#
# Segredo OBRIGATÓRIO (Settings > Secrets and variables > Actions > Secrets):
#   VPS_SSH_KEY   chave privada SSH com acesso de root (ou de um usuário com sudo sem senha) à VPS
# Segredo OPCIONAL:
#   INSTALL_CODE  código do instalador web escolhido por você (6+ letras/números/hífen). Vale até concluir a instalação.
#   SERVIDOR_ENV  bloco de credenciais (uma por linha: KEY=valor ou "KEY": "valor"): e-mail (SMTP_*), Agora, chaves de IA
#                 (GEMINI/GOOGLE/OPENAI/POLLINATIONS/ANTHROPIC — o app tenta uma após a outra) e afins. Só as chaves que o
#                 app usa são gravadas em server/.env na VPS; o resto é ignorado. Os valores nunca aparecem no log.
# Variáveis OPCIONAIS (mesma tela, aba Variables) — sem elas valem os padrões abaixo:
#   VPS_HOST (159.223.22.82)  VPS_USER (root)  VPS_PORT (22)  VPS_DIR (/opt/revalida)
#   DOMINIO (revalida.m3d.pro)  EMAIL_CERT (e-mail para o Let's Encrypt avisar de vencimento)
name: Publicar na VPS

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar-vps.yml']
  workflow_dispatch:

concurrency:
  group: publicar-vps
  cancel-in-progress: false

env:
  HOST: ${{ vars.VPS_HOST || '159.223.22.82' }}
  USUARIO: ${{ vars.VPS_USER || 'root' }}
  PORTA_SSH: ${{ vars.VPS_PORT || '22' }}
  PASTA: ${{ vars.VPS_DIR || '/opt/revalida' }}
  DOMINIO: ${{ vars.DOMINIO || 'revalida.m3d.pro' }}
  EMAIL_CERT: ${{ vars.EMAIL_CERT || '' }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Preparar SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Falta o segredo VPS_SSH_KEY (Settings > Secrets and variables > Actions). Veja as instruções no topo deste arquivo."; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          ssh-keyscan -p "$PORTA_SSH" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/vps -p $PORTA_SSH -o ServerAliveInterval=30 $USUARIO@$HOST" >> "$GITHUB_ENV"
          echo "SUDO=$([ "$USUARIO" = root ] && echo '' || echo 'sudo -n')" >> "$GITHUB_ENV"

      - name: Testar acesso
        run: $SSH "echo conectado em \$(hostname) como \$(whoami)"

      - name: Copiar app/ para a VPS
        run: |
          $SSH "$SUDO mkdir -p '$PASTA/app' && $SUDO chown -R \$(whoami) '$PASTA' && (command -v rsync >/dev/null || ($SUDO apt-get update -qq && $SUDO apt-get install -y -qq rsync))"
          rsync -az --stats \
            --exclude '.env' --exclude 'backups/' --exclude 'node_modules/' --exclude '.DS_Store' \
            -e "ssh -i $HOME/.ssh/vps -p $PORTA_SSH" app/ "$USUARIO@$HOST:$PASTA/app/" | tail -12

      - name: Instalar ou atualizar, proxy reverso e HTTPS
        env:
          CODIGO: ${{ secrets.INSTALL_CODE }}
          SERVIDOR_ENV: ${{ secrets.SERVIDOR_ENV }}
        run: |
          EXTRA="--env-stdin"; [ -n "$EMAIL_CERT" ] && EXTRA="$EXTRA --email $EMAIL_CERT"
          # código e credenciais vão pela entrada padrão (não aparecem em log nem na linha de comando)
          { [ -n "$CODIGO" ] && printf 'INSTALL_CODE=%s\n' "$CODIGO"; printf '%s\n' "$SERVIDOR_ENV"; } \
            | $SSH "cd '$PASTA/app' && $SUDO bash scripts/vps-preparar.sh --dominio '$DOMINIO' $EXTRA"
