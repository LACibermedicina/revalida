server {
  listen 80;
  root /usr/share/nginx/html;
  location /watch/ { try_files $uri /watch/index.html; }
  # compressão: o código do app cai para ~1/4 do tamanho
  gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 1024; gzip_proxied any;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;

  # páginas sempre conferidas com o servidor (senão o navegador mostra uma versão antiga do app depois de cada atualização)
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
  # arquivos com hash no nome: podem ficar em cache para sempre
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  # a IA pode levar até ~2,5 min para criar uma estação
  location /api/ { proxy_pass http://api:3001; proxy_read_timeout 200s; proxy_send_timeout 200s;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }
  location /socket.io/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
