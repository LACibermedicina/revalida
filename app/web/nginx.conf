server {
  listen 80;
  root /usr/share/nginx/html;
  location /watch/ { try_files $uri /watch/index.html; }
  # páginas sempre conferidas com o servidor (senão o navegador mostra uma versão antiga do app depois de cada atualização)
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
  # arquivos com hash no nome: podem ficar em cache para sempre
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location /api/ { proxy_pass http://api:3001;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }
  location /socket.io/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
