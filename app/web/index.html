<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Revalida Prático</title>
  <!-- Tela de carregamento: aparece já no primeiro byte (CSS e JS inline) e só some quando TUDO está pronto -->
  <style>
    :root{--b-bg:#EEF4FB;--b-fg:#16233B;--b-suave:#5C6B84;--b-trilho:#DCE5F2;--b-a:#1F7AE0;--b-b:#7A5AF8}
    @media (prefers-color-scheme:dark){:root{--b-bg:#0F1726;--b-fg:#EAF0FB;--b-suave:#9FB0CC;--b-trilho:#2A3A58;--b-a:#5AA2FF;--b-b:#A18BFF}}
    html,body{margin:0;background:var(--b-bg)}
    html.carregando #root{visibility:hidden}                                  /* nada de layout pela metade */
    html.carregando .tela>*{animation-play-state:paused}                      /* entradas animadas começam quando a tela aparece */
    #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;
      background:var(--b-bg);color:var(--b-fg);font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;transition:opacity .3s ease}
    #boot.some{opacity:0;pointer-events:none}
    #boot .anel{position:relative;width:min(160px,48vmin);aspect-ratio:1}
    #boot svg{width:100%;height:100%;transform:rotate(-90deg)}
    #boot .trilho{fill:none;stroke:var(--b-trilho);stroke-width:8}
    #boot .arco{fill:none;stroke:url(#bg);stroke-width:8;stroke-linecap:round;stroke-dasharray:314.16;stroke-dashoffset:314.16}
    #boot .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(22px,9vmin,38px);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
    #boot .pct small{font-size:.5em;font-weight:700;opacity:.7;margin-left:1px}
    #boot .t{font-weight:800;font-size:clamp(15px,4vmin,18px)}
    #boot .s{color:var(--b-suave);font-weight:500;min-height:1.3em;font-size:clamp(12px,3.4vmin,14px)}
    #boot .gira{position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--b-a);animation:bgira 1.1s linear infinite;opacity:.55}
    #boot button{margin-top:6px;min-height:44px;padding:0 20px;border:0;border-radius:14px;background:var(--b-a);color:#fff;font:700 14px system-ui,sans-serif;cursor:pointer}
    #boot.erro .gira{display:none}
    @keyframes bgira{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#boot .gira{animation:none}#boot{transition:none}}
  </style>
</head>
<body>
  <div id="boot" role="progressbar" aria-label="Carregando o Revalida Prático" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="anel">
      <i class="gira"></i>
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--b-a)"/><stop offset="1" stop-color="var(--b-b)"/></linearGradient></defs>
        <circle class="trilho" cx="60" cy="60" r="50"/><circle class="arco" cx="60" cy="60" r="50"/>
      </svg>
      <div class="pct"><span><span id="boot-n">0</span><small>%</small></span></div>
    </div>
    <div class="t">Revalida Prático</div>
    <div class="s" id="boot-s">Preparando…</div>
  </div>
  <div id="root"></div>
  <noscript><p style="padding:24px;font:16px system-ui">Ative o JavaScript para usar o Revalida Prático.</p></noscript>
  <script nomodule>document.getElementById('boot').className='erro';document.getElementById('boot-s').textContent='Seu navegador é antigo demais para este app. Atualize o navegador.';</script>
  <script>
  /* Progresso REAL por etapas (pesos somam 100). O número sobe suave, nunca volta e nunca passa da etapa em andamento. */
  (function () {
    var ETAPAS = [['html', 10, 'Preparando…'], ['css', 20, 'Montando o visual…'], ['fontes', 20, 'Carregando fontes…'], ['js', 30, 'Iniciando o app…'], ['dados', 20, 'Buscando seus dados…']];
    var feitas = {}, mostrado = 0, fim = false, terminou = false, inicio = Date.now();
    var raiz = document.documentElement, caixa = document.getElementById('boot'), num = document.getElementById('boot-n'), txt = document.getElementById('boot-s');
    var arco = caixa.querySelector('.arco');
    var reduz = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    raiz.className += ' carregando';

    function alvo() { var a = 0, atual = null; for (var i = 0; i < ETAPAS.length; i++) { if (feitas[ETAPAS[i][0]]) a += ETAPAS[i][1]; else if (!atual) atual = ETAPAS[i]; } return { base: a, atual: atual }; }
    function pintar(v) {
      var n = Math.min(100, Math.floor(v));
      num.textContent = n; caixa.setAttribute('aria-valuenow', n);
      arco.style.strokeDashoffset = String(314.16 * (1 - Math.min(100, v) / 100));
    }
    function quadro() {
      if (terminou) return;
      var t = alvo(), teto = t.atual ? t.base + t.atual[1] * 0.85 : 100;       // dentro da etapa atual, anda até 85% dela
      if (t.atual) txt.textContent = t.atual[2];
      var meta = fim ? 100 : teto;
      var passo = fim ? Math.max(1.2, (100 - mostrado) * 0.25) : (mostrado < t.base ? Math.max(0.8, (t.base - mostrado) * 0.2) : 0.12);
      if (reduz) mostrado = fim ? 100 : Math.max(mostrado, t.base); else if (mostrado < meta) mostrado = Math.min(meta, mostrado + passo);
      pintar(mostrado);
      if (fim && mostrado >= 100 && !terminou) { terminou = true; setTimeout(sair, 260); return; }
      if (!terminou) requestAnimationFrame(quadro);
    }
    function sair() {
      caixa.className = 'some';
      raiz.className = raiz.className.replace(' carregando', '');
      setTimeout(function () { if (caixa.parentNode) caixa.parentNode.removeChild(caixa); }, 350);
    }
    function falha(msg) {
      if (terminou) return; terminou = true;
      caixa.className = 'erro'; txt.textContent = msg || 'Não foi possível carregar.';
      var b = document.createElement('button'); b.textContent = 'Tentar de novo'; b.onclick = function () { location.reload(); };
      caixa.appendChild(b);
      raiz.className = raiz.className.replace(' carregando', ''); // se algo já desenhou, deixa visível por baixo
    }
    var api = window.__boot = {
      etapa: function (n) { feitas[n] = true; },
      pronto: function () { ['html', 'css', 'fontes', 'js', 'dados'].forEach(function (n) { feitas[n] = true; }); fim = true; },
      erro: falha, progresso: function () { return mostrado; },
    };

    api.etapa('html');
    // CSS: espera todas as folhas <link> do documento
    function cssPronto() {
      var l = document.querySelectorAll('link[rel="stylesheet"]'), ok = true;
      for (var i = 0; i < l.length; i++) { try { if (!l[i].sheet) ok = false; } catch (e) { /* cross-origin: considera carregada */ } }
      return ok;
    }
    (function esperaCss() { if (document.readyState !== 'loading' && cssPronto()) api.etapa('css'); else setTimeout(esperaCss, 30); })();
    // fontes: até 4 s (rede bloqueada não pode travar a abertura)
    var fontesTimer = setTimeout(function () { api.etapa('fontes'); }, 4000);
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
      var espera = function () { if (feitas.css) { clearTimeout(fontesTimer); api.etapa('fontes'); } else setTimeout(espera, 30); }; espera();
    });
    // tudo precisa ficar pronto em 20 s, senão avisa com botão
    setTimeout(function () { if (!fim) falha('Está demorando mais que o normal. Verifique a conexão.'); }, 20000);
    window.addEventListener('error', function (e) { if (!fim && e && e.message && !/ResizeObserver/.test(e.message)) falha('Algo falhou ao iniciar o app.'); });
    window.addEventListener('unhandledrejection', function () { /* falhas de rede de dados são tratadas pelo app */ });
    requestAnimationFrame(quadro);
  })();
  </script>
  <script type="module" src="/src/main.jsx" onerror="window.__boot&&window.__boot.erro('Não foi possível baixar o app.')"></script>
</body>
</html>
