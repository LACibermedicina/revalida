<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><title>Revalida Relógio</title>
<style>
:root{--mar:#3b82f6;--sol:#f5b301;--coral:#ff6b57;--menta:#18b98a;--fundo:#0b1220;--tx:#f2f6ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--fundo);color:var(--tx);font-family:system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px max(14px,8vw);text-align:center}
h1{font-size:1rem;margin:0}.sub{font-size:.78rem;opacity:.7}
input{width:100%;min-height:44px;border-radius:14px;border:0;padding:0 12px;font:inherit;font-size:1rem}
button{min-height:48px;width:100%;border:0;border-radius:16px;font:inherit;font-weight:800;font-size:1rem;color:#fff;background:var(--mar);cursor:pointer}
button.menta{background:var(--menta)}button.coral{background:var(--coral)}button.cinza{background:#2a3550}
button[aria-pressed=true]{background:var(--menta)}
.tempo{font-size:3.4rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.tempo.coral{color:var(--coral)}.tempo.sol{color:var(--sol)}.tempo.mar{color:#9cc0ff}
.erro{color:var(--coral);font-weight:700;font-size:.8rem;min-height:1em}
.sala{text-align:left;background:#16203a}
[hidden]{display:none!important}
</style></head><body>
<main id="app" aria-live="polite"></main>
<script type="module" src="app.js"></script>
</body></html>
