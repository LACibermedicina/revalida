<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Revalida Prático"><defs><linearGradient id="avf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAFBF4"/><stop offset="1" stop-color="#BFEBDC"/></linearGradient><clipPath id="avc"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#avc)"><circle cx="100" cy="100" r="100" fill="url(#avf)"/><defs>
