#t b{display:block;font-size:20px;letter-spacing:.08em}

/* modo embutido (?embed=1): fundo transparente, sem textos nem botões */
.emb body,.emb{background:transparent}.emb body::before,.emb #t,.emb #ui,.emb #err{display:none}
.emb canvas{cursor:grab}.emb canvas.sobre{cursor:pointer}
</style>

mesh(new T.SphereGeometry(.06,12,12),metal,0,1.68,0,head);
[1,1.15,1.3,1.45].forEach(y=>{mesh(new T.TorusGeometry(.082-(y-.75)/.9*.04,.012,6,14),metal,0,y,0,head).rotation.x=Math.PI/2});
[-1,1].forEach(s=>{const pts=[];for(let k=0;k<=120;k++){const t=k/120,a=t*Math.PI*14;pts.push(new T.Vector3(s*(.8+t*.4),.1+Math.cos(a)*.08,Math.sin(a)*.08))}
 mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),240,.012,5),metal,0,0,0,head);
 mesh(new T.CylinderGeometry(.1,.1,.02,16),metal,s*1.22,.1,0,head).rotation.z=Math.PI/2});
// remendo lateral escuro
const pt=mesh(new T.PlaneGeometry(.5,.6),dark,.805,.3,.1,head);pt.rotation.y=Math.PI/2;
const tg=new T.CylinderGeometry(.005,.002,.14,3),tm=new T.MeshStandardMaterial({color:0xc9a876,roughness:1});
for(let i=0;i<90;i++){const a=Math.random()*4|0,u=(Math.random()*2-1)*.8,s=a%2?1:-1,q=.8*(Math.random()<.5?1:-1),p=a<2?[u,.8*s,q]:[.8*s,u,q];const f=mesh(tg,tm,p[0],p[1],p[2],head);f.rotation.set(Math.random()*2,0,Math.random()*2);f.castShadow=false}

// pernas
const legs=[-1,1].map(s=>{const g=new T.Group();g.position.set(s*.33,0,.05);root.add(g);
  mesh(new T.BoxGeometry(.5,.95,.55),burM,0,-.45,0,g);mesh(new T.SphereGeometry(.34,24,16),burM,0,-.95,.08,g).scale.set(.85,.8,1.1);mesh(new T.TorusGeometry(.28,.022,6,24),thread,0,-.8,.02,g).rotation.x=Math.PI/2;mesh(new T.BoxGeometry(.2,.22,.04),dark,.05,-.3,.28,g).rotation.z=.2;return g});
// braços
function arm(s){const g=new T.Group();g.position.set(s*.78,1.2,0);root.add(g);
  mesh(new T.CylinderGeometry(.22,.2,.65,24),coatM,0,-.32,0,g);mesh(new T.TorusGeometry(.205,.018,6,24),thread,0,-.63,0,g).rotation.x=Math.PI/2;
  mesh(new T.SphereGeometry(.26,24,16),burM,0,-.85,0,g);mesh(new T.SphereGeometry(.09,12,8),burM,s*-.2,-.9,.16,g);return g}
const armL=arm(-1),armR=arm(1);

// balão
const bal=new T.Group();scene.add(bal);
mesh(new T.CylinderGeometry(.01,.01,1.8,4),thread,0,.9,0,bal);
// balão verde em origami: poliedro facetado (sombreamento plano) com facetas em 5 tons de verde, nó em cone verde
const og=new T.IcosahedronGeometry(.6,1);const op=og.attributes.position,oc=new Float32Array(op.count*3),tons=[.55,.7,.85,1,.62];
for(let f=0;f<op.count;f+=3){const cy=(op.getY(f)+op.getY(f+1)+op.getY(f+2))/3,cx=(op.getX(f)+op.getX(f+1)+op.getX(f+2))/3,k=tons[(Math.floor(((cx+1)*3.1+(cy+1)*5.3)*7))%5|0]||.8;for(let j=0;j<3;j++){oc[(f+j)*3]=k;oc[(f+j)*3+1]=k;oc[(f+j)*3+2]=k}}
og.setAttribute('color',new T.BufferAttribute(oc,3));
const bM=new T.MeshStandardMaterial({color:0x3fae98,vertexColors:true,flatShading:true,roughness:.7,metalness:0});
const balloon=mesh(og,bM,0,2.45,0,bal);balloon.scale.set(.85,1.1,.85);
const knot=mesh(new T.ConeGeometry(.1,.2,4),new T.MeshStandardMaterial({color:0x2f8f80,flatShading:true,roughness:.7}),0,1.8,0,bal);knot.rotation.x=Math.PI;
let pop=0;
let dn=null;addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
addEventListener('pointerup',e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>6)return;dn=null;const r=new T.Raycaster();r.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),cam);
 if(r.intersectObject(balloon).length){pop=1;avisar({rv3d:'balao'})}else if(r.intersectObject(root,true).length){hop=1;avisar({rv3d:'toque'})}});
let hop=0;
addEventListener('pointermove',e=>{if(e.buttons)return;const r=new T.Raycaster();r.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),cam);cvs.classList.toggle('sobre',r.intersectObject(balloon).length>0||r.intersectObject(root,true).length>0)});

// poses
const P={sit:{y:.3,leg:-Math.PI/2,lx:-.9,lz:-.35,rx:-.3,rz:.2},
 stand:{y:.98,leg:0,lx:-.9,lz:-.35,rx:0,rz:.15},
 wave:{y:.98,leg:0,lx:-.9,lz:-.35,rx:0,rz:2.5}};
let cur_=P[Q.get('pose')]?Q.get('pose'):'sit';const S={...P[cur_]};
addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&P[e.data.rv3dPose]){cur_=e.data.rv3dPose;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===cur_))}});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cur_=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b))});
const auto=document.getElementById('auto');if(EMB)auto.checked=Q.get('auto')==='1'&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
const mouse={x:0,y:0};addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=e.clientY/innerHeight*2-1});
const clock=new T.Clock(),hand=new T.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  const p=P[cur_],k=1-Math.pow(.001,dt);for(const a in p)S[a]+=(p[a]-S[a])*k;
  if(hop>0)hop=Math.max(0,hop-dt*2.2);root.position.y=S.y+Math.sin((1-hop)*Math.PI)*(hop>0?.3:0);legs.forEach(l=>l.rotation.x=S.leg);
  armL.rotation.set(S.lx,0,S.lz);
  armR.rotation.set(S.rx,0,S.rz+(cur_==='wave'?Math.sin(t*7)*.3:0));
  head.rotation.y+=(mouse.x*.45-head.rotation.y)*.08;head.rotation.x+=(mouse.y*.25-head.rotation.x)*.08;
  head.position.y=2.2+Math.sin(t*2)*.01;
  armL.updateWorldMatrix(true,false);hand.set(0,-.85,0);armL.localToWorld(hand);
  bal.position.copy(hand);bal.rotation.set(Math.sin(t*1.3)*.12,0,Math.cos(t*1.1)*.12);
  if(pop>0){pop=Math.max(0,pop-dt*1.5);const s=1+Math.sin((1-pop)*Math.PI)*.25;balloon.scale.set(.85*s,1.1*s,.85*s)}
  ant.rotation.z=Math.sin(t*3)*.02;
  ecg(dt);ctl.autoRotate=auto.checked;ctl.update(dt);ren.render(scene,cam);if(!window.__ok){window.__ok=1;avisar({rv3d:'ok'})}}
loop();}
</script>
<script>
if(window.__boot)window.__boot();else showErr('falha ao iniciar o carregador');
</script>
</body>
